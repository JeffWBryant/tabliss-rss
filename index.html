<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RSS News</title>


<style>


/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 20px;

    background: transparent;

    color: black;

    font-family: Arial, sans-serif;

}


/* =========================
   RSS GRID
   ========================= */

.rss-grid {

    display: grid;

    grid-template-columns: 1fr;

    gap: 12px;

    width: 100%;

}


/* =========================
   FEED BOX
   ========================= */

.rss-column {

    min-width: 0;

    padding: 15px;

    border:
        1.5px solid
        rgba(0, 0, 0, 0.5);

    background:
        rgba(255, 255, 255, 0.75);

}


/* =========================
   FEED TITLE
   ========================= */

.rss-header {

    color: black;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 15px;

    line-height: 1.2;

    cursor: pointer;

    user-select: none;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.rss-header::after {

    content: "▼";

    font-size: 12px;

    margin-left: 10px;

}


.rss-column.collapsed .rss-header {

    margin-bottom: 0;

}


.rss-column.collapsed .rss-header::after {

    content: "▶";

}


/* =========================
   ARTICLE
   ========================= */

.article {

    margin-bottom: 20px;

}


.article:last-child {

    margin-bottom: 0;

}


/* =========================
   ARTICLE IMAGE
   ========================= */

.article img {

    display: block;

    width: 100%;

    height: 120px;

    object-fit: cover;

    margin-bottom: 8px;

}


/* =========================
   ARTICLE TITLE
   ========================= */

.article-title {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

    margin-bottom: 5px;

}


.article-title a {

    color: black;

    text-decoration: none;

}


.article-title a:hover {

    text-decoration: underline;

}


/* =========================
   ARTICLE DATE
   ========================= */

.article-date {

    color: black;

    font-size: 11px;

    opacity: 0.6;

    margin-bottom: 6px;

}


/* =========================
   ARTICLE DESCRIPTION
   ========================= */

.article-description {

    color: black;

    font-size: 12px;

    line-height: 1.4;

    opacity: 0.8;

}


/* =========================
   ERROR
   ========================= */

.error {

    color: black;

    font-size: 12px;

    opacity: 0.6;

}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1000px) {

    .rss-grid {

        grid-template-columns: 1fr;

    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    body {

        padding: 10px;

    }


    .rss-grid {

        grid-template-columns: 1fr;

    }

}


</style>

</head>


<body>


<div class="rss-grid">


    <!-- =========================
         BLOODY DISGUSTING
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Bloody Disgusting
        </div>

        <div id="bloody">
            Loading...
        </div>

    </div>


    <!-- =========================
         DEN OF GEEK
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Den of Geek
        </div>

        <div id="denofgeek">
            Loading...
        </div>

    </div>


    <!-- =========================
         FANGORIA
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Fangoria
        </div>

        <div id="fangoria">
            Loading...
        </div>

    </div>


    <!-- =========================
         PLAYSTATION LIFESTYLE
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Lifestyle
        </div>

        <div id="psl">
            Loading...
        </div>

    </div>


    <!-- =========================
         PLAYSTATION BLOG
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Blog
        </div>

        <div id="psblog">
            Loading...
        </div>

    </div>


    <!-- =========================
         PUSH SQUARE
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Push Square
        </div>

        <div id="pushsquare">
            Loading...
        </div>

    </div>


    <!-- =========================
         STEAM
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Steam
        </div>

        <div id="steam">
            Loading...
        </div>

    </div>


    <!-- =========================
         STEAM GAME DEALS
         ========================= -->

    <div class="rss-column">

        <div class="rss-header">
            Steam Game Deals
        </div>

        <div id="steamdeals">
            Loading...
        </div>

    </div>


</div>



<script>


/* =========================
   LOAD FEEDS.JSON
   ========================= */

async function loadFeeds() {


    try {


        const response =
            await fetch(
                "feeds.json?" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load feeds.json"
            );

        }


        const data =
            await response.json();


        const feeds =
            data.feeds;


        /* =========================
           RENDER EACH FEED
           ========================= */

        Object.entries(feeds)
            .forEach(
                ([name, feed]) => {


                    let elementId;


                    switch (name) {


                        case "Bloody Disgusting":

                            elementId =
                                "bloody";

                            break;


                        case "Den of Geek":

                            elementId =
                                "denofgeek";

                            break;


                        case "Fangoria":

                            elementId =
                                "fangoria";

                            break;


                        case "PlayStation Lifestyle":

                            elementId =
                                "psl";

                            break;


                        case "PlayStation Blog":

                            elementId =
                                "psblog";

                            break;


                        case "Push Square":

                            elementId =
                                "pushsquare";

                            break;


                        case "Steam":

                            elementId =
                                "steam";

                            break;


                        case "Steam Game Deals":

                            elementId =
                                "steamdeals";

                            break;


                        default:

                            return;

                    }


                    const container =
                        document.getElementById(
                            elementId
                        );


                    if (!container) {

                        return;

                    }


                    if (
                        !feed.articles ||
                        feed.articles.length === 0
                    ) {


                        container.innerHTML =

                            `
                            <div class="error">

                                ${
                                    feed.error
                                    ?
                                    "Unable to load feed."
                                    :
                                    "No articles found."

                                }

                            </div>
                            `;


                        return;

                    }


                    /* =========================
                       ARTICLES
                       ========================= */

                    container.innerHTML =

                        feed.articles
                        .slice(0, 5)
                        .map(
                            article => {


                                const image =
                                    article.image
                                    ?
                                    `
                                    <img
                                        src="${article.image}"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none'
                                        "
                                    >
                                    `
                                    :
                                    "";


                                const title =
                                    article.title
                                    ||
                                    "Untitled";


                                const description =
                                    article.description
                                    ||
                                    "";


                                let date =
                                    "";


                                if (
                                    article.date
                                ) {

                                    const parsedDate =
                                        new Date(
                                            article.date
                                        );


                                    if (
                                        !isNaN(
                                            parsedDate
                                        )
                                    ) {

                                        date =
                                            parsedDate
                                            .toLocaleDateString();

                                    }

                                }


                                return `

                                <div
                                    class="article"
                                >

                                    ${image}


                                    <div
                                        class="article-title"
                                    >

                                        <a
                                            href="${article.link}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >

                                            ${title}

                                        </a>

                                    </div>


                                    ${
                                        date
                                        ?

                                        `
                                        <div
                                            class="article-date"
                                        >

                                            ${date}

                                        </div>
                                        `

                                        :

                                        ""
                                    }


                                    ${
                                        description
                                        ?

                                        `
                                        <div
                                            class="article-description"
                                        >

                                            ${description}

                                        </div>
                                        `

                                        :

                                        ""
                                    }


                                </div>

                                `;

                            }
                        )
                        .join("");


                }
            );


    }


    catch (error) {


        console.error(
            error
        );


        document.querySelectorAll(
            ".rss-column > div[id]"
        )
        .forEach(
            element => {

                element.innerHTML =

                    `
                    <div
                        class="error"
                    >

                        Unable to load RSS data.

                    </div>
                    `;

            }
        );

    }

}


/* =========================
   COLLAPSIBLE FEEDS
   ========================= */

document.querySelectorAll(".rss-header").forEach(header => {

    header.addEventListener("click", () => {

        const column =
            header.closest(".rss-column");

        column.classList.toggle("collapsed");

        const content =
            column.querySelector(
                ":scope > div:not(.rss-header)"
            );

        if (content) {

            content.style.display =
                column.classList.contains("collapsed")
                ? "none"
                : "";

        }

    });

});


/* =========================
   START
   ========================= */

loadFeeds();


</script>


</body>

</html>
