<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RSS News</title>


<style>

/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    background: transparent;

    color: black;

    font-family: Arial, sans-serif;
}


/* =========================
   RSS CONTAINER / BORDER
   ========================= */

.rss-container {

    width: 100%;

    border:
        2.5px solid
        #607080;

    border-radius: 15px;

    padding: 10px;

    background:
        rgba(255, 255, 255, 0.15);

}


/* =========================
   RSS GRID
   ========================= */

.rss-grid {

    display: grid;

    grid-template-columns: 1fr;

    gap: 12px;

    width: 100%;

}


/* =========================
   FEED BOX
   ========================= */

.rss-column {

    min-width: 0;

    padding: 15px;

    border:
        1.5px solid
        rgba(0, 0, 0, 0.5);

    background:
        rgba(255, 255, 255, 0.75);

}


/* =========================
   FEED TITLE
   ========================= */

.rss-header {

    color: black;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.2;

    margin: 0;

    padding: 0 0 15px 0;

    cursor: pointer;

    user-select: none;

    display: flex;

    align-items: center;

    justify-content: flex-start;

}


/* =========================
   LEFT ARROW
   ========================= */

.rss-header::before {

    content: "▼";

    font-size: 12px;

    margin-right: 10px;

}


/* =========================
   COLLAPSED ARROW
   ========================= */

.rss-column.collapsed .rss-header::before {

    content: "▶";

}


/* =========================
   COLLAPSED HEADER
   ========================= */

.rss-column.collapsed .rss-header {

    padding-bottom: 0;

}


/* =========================
   HIDE COLLAPSED CONTENT
   ========================= */

.rss-column.collapsed .rss-content {

    display: none;

}


/* =========================
   ARTICLE
   ========================= */

.article {

    margin-bottom: 20px;

}


.article:last-child {

    margin-bottom: 0;

}


/* =========================
   ARTICLE IMAGE
   ========================= */

.article img {

    display: block;

    width: 100%;

    height: 120px;

    object-fit: cover;

    margin-bottom: 8px;

}


/* =========================
   ARTICLE TITLE
   ========================= */

.article-title {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

    margin-bottom: 5px;

}


.article-title a {

    color: black;

    text-decoration: none;

}


.article-title a:hover {

    text-decoration: underline;

}


/* =========================
   ARTICLE DATE
   ========================= */

.article-date {

    color: black;

    font-size: 11px;

    opacity: 0.6;

    margin-bottom: 6px;

}


/* =========================
   ARTICLE DESCRIPTION
   ========================= */

.article-description {

    color: black;

    font-size: 12px;

    line-height: 1.4;

    opacity: 0.8;

}


/* =========================
   ERROR
   ========================= */

.error {

    color: black;

    font-size: 12px;

    opacity: 0.6;

}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1000px) {

    .rss-grid {

        grid-template-columns: 1fr;

    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .rss-container {

        padding: 8px;

    }

}

</style>

</head>


<body>


<div class="rss-container">

<div class="rss-grid">


    <!-- BLOODY DISGUSTING -->

    <div class="rss-column">

        <div class="rss-header">
            Bloody Disgusting
        </div>

        <div
            id="bloody"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- DEN OF GEEK -->

    <div class="rss-column">

        <div class="rss-header">
            Den of Geek
        </div>

        <div
            id="denofgeek"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- FANGORIA -->

    <div class="rss-column">

        <div class="rss-header">
            Fangoria
        </div>

        <div
            id="fangoria"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- PLAYSTATION LIFESTYLE -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Lifestyle
        </div>

        <div
            id="psl"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- PLAYSTATION BLOG -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Blog
        </div>

        <div
            id="psblog"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- PUSH SQUARE -->

    <div class="rss-column">

        <div class="rss-header">
            Push Square
        </div>

        <div
            id="pushsquare"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- STEAM -->

    <div class="rss-column">

        <div class="rss-header">
            Steam
        </div>

        <div
            id="steam"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


    <!-- STEAM GAME DEALS -->

    <div class="rss-column">

        <div class="rss-header">
            Steam Game Deals
        </div>

        <div
            id="steamdeals"
            class="rss-content"
        >
            Loading...
        </div>

    </div>


</div>

</div>



<script>

/* =========================
   RESIZE PARENT IFRAME
   ========================= */

function resizeParentIframe() {

    const height =
        document.documentElement.scrollHeight;

    window.parent.postMessage(
        {
            type: "rssResize",
            height: height
        },
        "*"
    );

}


/* =========================
   LOAD FEEDS.JSON
   ========================= */

async function loadFeeds() {

    try {

        const response =
            await fetch(
                "feeds.json?" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load feeds.json"
            );

        }


        const data =
            await response.json();


        const feeds =
            data.feeds;


        /* =========================
           RENDER EACH FEED
           ========================= */

        Object.entries(feeds)
            .forEach(
                ([name, feed]) => {

                    let elementId;


                    switch (name) {

                        case "Bloody Disgusting":
                            elementId = "bloody";
                            break;

                        case "Den of Geek":
                            elementId = "denofgeek";
                            break;

                        case "Fangoria":
                            elementId = "fangoria";
                            break;

                        case "PlayStation Lifestyle":
                            elementId = "psl";
                            break;

                        case "PlayStation Blog":
                            elementId = "psblog";
                            break;

                        case "Push Square":
                            elementId = "pushsquare";
                            break;

                        case "Steam":
                            elementId = "steam";
                            break;

                        case "Steam Game Deals":
                            elementId = "steamdeals";
                            break;

                        default:
                            return;

                    }


                    const container =
                        document.getElementById(
                            elementId
                        );


                    if (!container) {
                        return;
                    }


                    /* =========================
                       NO ARTICLES
                       ========================= */

                    if (
                        !feed.articles ||
                        feed.articles.length === 0
                    ) {

                        container.innerHTML =

                            `
                            <div class="error">

                                ${
                                    feed.error
                                    ?
                                    "Unable to load feed."
                                    :
                                    "No articles found."

                                }

                            </div>
                            `;

                        return;

                    }


                    /* =========================
                       ARTICLES
                       ========================= */

                    container.innerHTML =

                        feed.articles
                        .slice(0, 5)
                        .map(
                            article => {

                                const image =
                                    article.image
                                    ?
                                    `
                                    <img
                                        src="${article.image}"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none'
                                        "
                                    >
                                    `
                                    :
                                    "";


                                const title =
                                    article.title
                                    ||
                                    "Untitled";


                                const description =
                                    article.description
                                    ||
                                    "";


                                let date =
                                    "";


                                if (
                                    article.date
                                ) {

                                    const parsedDate =
                                        new Date(
                                            article.date
                                        );


                                    if (
                                        !isNaN(
                                            parsedDate
                                        )
                                    ) {

                                        date =
                                            parsedDate
                                            .toLocaleDateString();

                                    }

                                }


                                return `

                                <div
                                    class="article"
                                >

                                    ${image}


                                    <div
                                        class="article-title"
                                    >

                                        <a
                                            href="${article.link}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >

                                            ${title}

                                        </a>

                                    </div>


                                    ${
                                        date
                                        ?

                                        `
                                        <div
                                            class="article-date"
                                        >

                                            ${date}

                                        </div>
                                        `

                                        :

                                        ""
                                    }


                                    ${
                                        description
                                        ?

                                        `
                                        <div
                                            class="article-description"
                                        >

                                            ${description}

                                        </div>
                                        `

                                        :

                                        ""
                                    }


                                </div>

                                `;

                            }
                        )
                        .join("");

                }
            );


        /* Give images/content a moment to affect height */

        setTimeout(
            resizeParentIframe,
            100
        );

    }


    catch (error) {

        console.error(error);


        document.querySelectorAll(
            ".rss-column > div[id]"
        )
        .forEach(
            element => {

                element.innerHTML =

                    `
                    <div class="error">

                        Unable to load RSS data.

                    </div>
                    `;

            }
        );


        resizeParentIframe();

    }

}


/* =========================
   COLLAPSIBLE FEEDS
   ========================= */

document
    .querySelectorAll(".rss-header")
    .forEach(
        header => {

            header.addEventListener(
                "click",
                function() {

                    const column =
                        this.parentElement;

                    column.classList.toggle(
                        "collapsed"
                    );


                    /* Resize iframe after collapse */

                    setTimeout(
                        resizeParentIframe,
                        10
                    );

                }
            );

        }
    );


/* =========================
   WATCH FOR HEIGHT CHANGES
   ========================= */

const resizeObserver =
    new ResizeObserver(
        () => {

            resizeParentIframe();

        }
    );


resizeObserver.observe(
    document.querySelector(
        ".rss-container"
    )
);


/* =========================
   START
   ========================= */

loadFeeds();


</script>


</body>

</html>
