<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSS News</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================
   RSS GRID
   ========================= */

.rss-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
}


/* =========================
   INDIVIDUAL FEED BOX
   ========================= */

.rss-column {
    min-width: 0;
    padding: 15px;

    border: 1.5px solid rgba(255,255,255,0.5);

    background: rgba(0,0,0,0.15);
}


/* =========================
   FEED TITLE
   ========================= */

.rss-header {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.2;
}


/* =========================
   ARTICLES
   ========================= */

.article {
    margin-bottom: 20px;
}

.article:last-child {
    margin-bottom: 0;
}


/* =========================
   ARTICLE IMAGE
   ========================= */

.article img {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin-bottom: 8px;
}


/* =========================
   ARTICLE TITLE
   ========================= */

.article-title {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    margin-bottom: 5px;
}

.article-title a {
    color: white;
    text-decoration: none;
}

.article-title a:hover {
    text-decoration: underline;
}


/* =========================
   ARTICLE DATE
   ========================= */

.article-date {
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 6px;
}


/* =========================
   ARTICLE DESCRIPTION
   ========================= */

.article-description {
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.8;
}


/* =========================
   ERROR
   ========================= */

.error {
    font-size: 12px;
    opacity: 0.6;
}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1000px) {

    .rss-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .rss-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div class="rss-grid">


    <!-- BLOODY DISGUSTING -->

    <div class="rss-column">

        <div class="rss-header">
            Bloody Disgusting
        </div>

        <div id="bloody">
            Loading...
        </div>

    </div>


    <!-- DEN OF GEEK -->

    <div class="rss-column">

        <div class="rss-header">
            Den of Geek
        </div>

        <div id="denofgeek">
            Loading...
        </div>

    </div>


    <!-- FANGORIA -->

    <div class="rss-column">

        <div class="rss-header">
            Fangoria
        </div>

        <div id="fangoria">
            Loading...
        </div>

    </div>


    <!-- PLAYSTATION LIFESTYLE -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Lifestyle
        </div>

        <div id="psl">
            Loading...
        </div>

    </div>


    <!-- PLAYSTATION BLOG -->

    <div class="rss-column">

        <div class="rss-header">
            PlayStation Blog
        </div>

        <div id="psblog">
            Loading...
        </div>

    </div>


    <!-- PUSH SQUARE -->

    <div class="rss-column">

        <div class="rss-header">
            Push Square
        </div>

        <div id="pushsquare">
            Loading...
        </div>

    </div>


    <!-- STEAM -->

    <div class="rss-column">

        <div class="rss-header">
            Steam
        </div>

        <div id="steam">
            Loading...
        </div>

    </div>


    <!-- STEAM GAME DEALS -->

    <div class="rss-column">

        <div class="rss-header">
            Steam Game Deals
        </div>

        <div id="steamdeals">
            Loading...
        </div>

    </div>


</div>



<script>


/* =========================
   RSS FEEDS
   ========================= */

const feeds = [

    {
        name: "bloody",
        url: "https://bloody-disgusting.com/feed/"
    },

    {
        name: "denofgeek",
        url: "https://www.denofgeek.com/feed/"
    },

    {
        name: "fangoria",
        url: "https://www.fangoria.com/feed/"
    },

    {
        name: "psl",
        url: "https://www.playstationlifestyle.net/feed/"
    },

    {
        name: "psblog",
        url: "https://blog.playstation.com/feed/"
    },

    {
        name: "pushsquare",
        url: "https://www.pushsquare.com/feeds/latest"
    },

    {
        name: "steam",
        url: "https://store.steampowered.com/feeds/news.xml"
    },

    {
        name: "steamdeals",
        url: "https://www.steamgamesales.com/rss"
    }

];


/* =========================
   CLEAN TEXT
   ========================= */

function cleanText(text) {

    if (!text) {
        return "";
    }

    const temp =
        document.createElement("div");

    temp.innerHTML = text;

    return temp.textContent
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================
   FIND ARTICLE IMAGE
   ========================= */

function findImage(item) {

    /* RSS2JSON thumbnail */

    if (item.thumbnail) {
        return item.thumbnail;
    }


    /* RSS enclosure */

    if (
        item.enclosure &&
        item.enclosure.link
    ) {
        return item.enclosure.link;
    }


    /* Image inside content */

    if (item.content) {

        const match =
            item.content.match(
                /<img[^>]+src=["']([^"']+)["']/i
            );

        if (match) {
            return match[1];
        }
    }


    /* Image inside description */

    if (item.description) {

        const match =
            item.description.match(
                /<img[^>]+src=["']([^"']+)["']/i
            );

        if (match) {
            return match[1];
        }
    }


    return "";
}


/* =========================
   LOAD RSS FEED
   ========================= */

async function loadFeed(feed) {

    const container =
        document.getElementById(
            feed.name
        );

    try {

        const proxy =
            "https://api.rss2json.com/v1/api.json?rss_url=" +
            encodeURIComponent(
                feed.url
            );

        const response =
            await fetch(proxy);

        const data =
            await response.json();

        if (
            !data.items ||
            data.items.length === 0
        ) {
            throw new Error(
                "No articles found"
            );
        }


        container.innerHTML =

            data.items
            .slice(0, 5)
            .map(item => {

                /* TITLE */

                const title =
                    cleanText(
                        item.title
                    );


                /* DESCRIPTION */

                const description =
                    cleanText(
                        item.description ||
                        item.content ||
                        ""
                    ).substring(
                        0,
                        180
                    );


                /* IMAGE */

                const image =
                    findImage(item);


                /* DATE */

                let date = "";

                if (item.pubDate) {

                    date =
                        new Date(
                            item.pubDate
                        ).toLocaleDateString();

                }


                return `

                    <div class="article">

                        ${
                            image
                            ?
                            `
                            <img
                                src="${image}"
                                loading="lazy"
                                onerror="
                                    this.style.display='none'
                                "
                            >
                            `
                            :
                            ""
                        }


                        <div class="article-title">

                            <a
                                href="${item.link}"
                                target="_blank"
                                rel="noopener"
                            >

                                ${title}

                            </a>

                        </div>


                        ${
                            date
                            ?
                            `
                            <div class="article-date">

                                ${date}

                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            description
                            ?
                            `
                            <div class="article-description">

                                ${description}...

                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            })
            .join("");

    }

    catch (error) {

        console.error(
            feed.name,
            error
        );

        container.innerHTML =

            `
            <div class="error">

                Unable to load feed.

            </div>
            `;

    }
}


/* =========================
   LOAD ALL FEEDS
   ========================= */

feeds.forEach(
    loadFeed
);

</script>

</body>
</html>
