<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSS News</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
}

.rss-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
    border: 1.5px solid rgba(255,255,255,0.5);
}

.rss-column {
    min-width: 0;
    padding: 15px;
    border-right: 1.5px solid rgba(255,255,255,0.5);
    border-bottom: 1.5px solid rgba(255,255,255,0.5);
}

.rss-column:nth-child(4n) {
    border-right: none;
}

.rss-column:nth-last-child(-n+4) {
    border-bottom: none;
}

.rss-header {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.article {
    margin-bottom: 20px;
}

.article img {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin-bottom: 8px;
}

.article-title {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    margin-bottom: 5px;
}

.article-title a {
    color: white;
    text-decoration: none;
}

.article-title a:hover {
    text-decoration: underline;
}

.article-date {
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 6px;
}

.article-description {
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.8;
}

.error {
    font-size: 12px;
    opacity: 0.6;
}

@media (max-width: 1000px) {

    .rss-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .rss-grid {
        grid-template-columns: 1fr;
    }

    .rss-column {
        border-right: none !important;
    }

}

</style>
</head>

<body>

<div class="rss-grid">

    <div class="rss-column">
        <div class="rss-header">Bloody Disgusting</div>
        <div id="bloody">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">Den of Geek</div>
        <div id="denofgeek">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">Fangoria</div>
        <div id="fangoria">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">PlayStation Lifestyle</div>
        <div id="psl">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">PlayStation Blog</div>
        <div id="psblog">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">Push Square</div>
        <div id="pushsquare">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">Steam</div>
        <div id="steam">Loading...</div>
    </div>

    <div class="rss-column">
        <div class="rss-header">Steam Game Deals</div>
        <div id="steamdeals">Loading...</div>
    </div>

</div>

<script>

const feeds = [

    {
        name: "bloody",
        url: "https://bloody-disgusting.com/feed/"
    },

    {
        name: "denofgeek",
        url: "https://www.denofgeek.com/feed/"
    },

    {
        name: "fangoria",
        url: "https://www.fangoria.com/feed/"
    },

    {
        name: "psl",
        url: "https://www.playstationlifestyle.net/feed/"
    },

    {
        name: "psblog",
        url: "https://blog.playstation.com/feed/"
    },

    {
        name: "pushsquare",
        url: "https://www.pushsquare.com/feeds/latest"
    },

    {
        name: "steam",
        url: "https://store.steampowered.com/feeds/news.xml"
    },

    {
        name: "steamdeals",
        url: "https://www.steamgamesales.com/rss"
    }

];


function cleanText(text) {

    if (!text) return "";

    const temp = document.createElement("div");

    temp.innerHTML = text;

    return temp.textContent
        .replace(/\s+/g, " ")
        .trim();

}


function findImage(item) {

    if (item.thumbnail) {
        return item.thumbnail;
    }

    if (item.enclosure &&
        item.enclosure.link) {

        return item.enclosure.link;
    }

    if (item.content) {

        const match =
            item.content.match(/<img[^>]+src=["']([^"']+)["']/i);

        if (match) {
            return match[1];
        }
    }

    if (item.description) {

        const match =
            item.description.match(/<img[^>]+src=["']([^"']+)["']/i);

        if (match) {
            return match[1];
        }
    }

    return "";
}


async function loadFeed(feed) {

    const container =
        document.getElementById(feed.name);

    try {

        const proxy =
            "https://api.rss2json.com/v1/api.json?rss_url=" +
            encodeURIComponent(feed.url);

        const response =
            await fetch(proxy);

        const data =
            await response.json();

        if (!data.items ||
            data.items.length === 0) {

            throw new Error("No articles");
        }

        container.innerHTML =
            data.items
            .slice(0, 5)
            .map(item => {

                const title =
                    cleanText(item.title);

                const description =
                    cleanText(
                        item.description ||
                        item.content ||
                        ""
                    ).substring(0, 180);

                const image =
                    findImage(item);

                let date = "";

                if (item.pubDate) {

                    date =
                        new Date(item.pubDate)
                        .toLocaleDateString();

                }

                return `

                    <div class="article">

                        ${
                            image
                            ?
                            `
                            <img
                                src="${image}"
                                loading="lazy"
                                onerror="this.style.display='none'"
                            >
                            `
                            :
                            ""
                        }

                        <div class="article-title">

                            <a
                                href="${item.link}"
                                target="_blank"
                                rel="noopener"
                            >
                                ${title}
                            </a>

                        </div>

                        ${
                            date
                            ?
                            `
                            <div class="article-date">
                                ${date}
                            </div>
                            `
                            :
                            ""
                        }

                        ${
                            description
                            ?
                            `
                            <div class="article-description">
                                ${description}...
                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            })
            .join("");

    }

    catch (error) {

        console.error(
            feed.name,
            error
        );

        container.innerHTML =
            `
            <div class="error">
                Unable to load feed.
            </div>
            `;

    }

}


feeds.forEach(loadFeed);

</script>

</body>
</html>
